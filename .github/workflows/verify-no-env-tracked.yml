# Fail CI if .env (secrets file) is accidentally committed — .gitignore alone cannot
# remove already-tracked files.
name: Verify .env not tracked

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure .env is not in git index
        run: |
          set -e
          if [ -n "$(git ls-files .env)" ]; then
            echo "::error::.env is tracked by git. Remove with: git rm --cached .env"
            exit 1
          fi
          echo "OK: .env is not tracked."
